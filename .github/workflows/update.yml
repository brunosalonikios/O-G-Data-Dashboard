name: Atualizar dashboard

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "site/**", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar dados
        run: python collector/collect.py

      - name: Salvar dados novos no repositório
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/dashboard.json data/
          if git diff --cached --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "Dados atualizados $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs --autostash origin main || { git rebase --abort; git pull --no-rebase -X ours --no-edit origin main; }
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
